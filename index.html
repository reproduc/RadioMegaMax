/* ===== MODOS DE ONDAS ===== */

/* MODO 1 – BARRAS RECTAS */
.audio-waves.mode-bars span{
  border-radius:2px;
}

/* MODO 2 – ONDAS SUAVES */
.audio-waves.mode-wave span{
  border-radius:50px;
  transform-origin:bottom;
}

/* MODO 3 – PICOS AGRESIVOS */
.audio-waves.mode-peak span{
  border-radius:2px;
  filter:drop-shadow(0 0 8px #ffd400);
}

/* ===============================
   ONDAS ELECTRICAS

   
=============================== */

/* ELECTRIC PULSE */
.audio-waves.electric-pulse span{
  background:linear-gradient(180deg,#00ffff,#ffee00,#ff004c);
  box-shadow:0 0 12px #00ffff;
  transform:skewX(-8deg);
  border-radius:2px;
}

/* NEON ZIGZAG */
.audio-waves.neon-zigzag span{
  background:linear-gradient(180deg,#39ff14,#00eaff,#ffe600);
  box-shadow:0 0 14px #39ff14;
  border-radius:0;
  transform:rotate(1deg);
}

/* LIGHTNING LINE */
.audio-waves.lightning-line span{
  background:linear-gradient(180deg,#ffffff,#00c3ff,#0066ff);
  box-shadow:0 0 18px #00c3ff;
  border-radius:1px;
}
/* 🔥 MODO 5 – CÍRCULOS VIBRANTES NUEVAS ONDAS  */
.audio-waves.circle-pulse span{
  border-radius:50%;
  background:radial-gradient(circle,#00f7ff,#e5ff00);
  box-shadow:0 0 10px #000000fb;
}

/* 🔥 MODO 6 – FUEGO */
.audio-waves.fire span{
  background:linear-gradient(180deg,#ff0000,#000000,#ffd400);
  box-shadow:0 0 12px #04ffb4;
  border-radius:3px;
}

/* 🔥 MODO 7 – AGUA */
.audio-waves.water span{
  background:linear-gradient(180deg,#00cfff,#0044ff);
  box-shadow:0 0 10px #00cfff;
  border-radius:20px;
}

/* 🔥 MODO 8 – MATRIX DIGITAL */
.audio-waves.matrix span{
  background:linear-gradient(180deg,#00ff00,#003300);
  box-shadow:0 0 12px #00ff00;
  border-radius:1px;
}
/* BASE FIJA DESDE ABAJO (ELECTRICIDAD REAL) */
.audio-waves span{
  transform-origin: bottom center;
}
/* 🔥 MODO 9 – PULSO DOBLE */
.audio-waves.double-pulse span{
  background:linear-gradient(180deg,#ff00ff,#00ffff);
  box-shadow:0 0 14px #ff00ff;
  border-radius:6px;
}

/* 🔥 MODO 10 – BARRAS ROTAS */
.audio-waves.broken-bars span{
  background:linear-gradient(180deg,#ffd400,#ff004c);
  box-shadow:0 0 10px #ffd400;
  border-radius:1px;
  transform:skewY(-10deg);
}

/* 🔥 MODO 11 – ONDA NEÓN SUAVE */
.audio-waves.soft-neon span{
  background:linear-gradient(180deg,#39ff14,#00ffea);
  box-shadow:0 0 18px #39ff14;
  border-radius:50px;
}

/* 🔥 MODO 12 – IMPACTO GRAVE */
.audio-waves.bass-impact span{

  border-radius:4px;

/*CODIGO DE STYLE DE EL MEDIDOR DE MUSICA QUE VOY A AGREGAR*/
/* ===== PANEL AUDIO MONITOR ENCIMA DE LA BARRA ===== */
.monitor-wrapper{
  position:fixed;
  bottom:125px; /* justo encima de la barra */
  left:50%;
  transform:translateX(-50%);
  width:95%;
  max-width:900px;
  z-index:50;
  pointer-events:none;
}

/* ===== MONITOR EN FILA PC ===== */
.monitor{
  display:grid;
  grid-template-columns: repeat(6, 1fr);
  grid-auto-rows: 100px; /* un poco más alto */
  gap:6px;
}
/* 💻 PC NORMAL */
@media (min-width:769px){
  .monitor-wrapper{
    bottom:100px;   /* baja el panel sobre la barra */
  }
}

/* 🖥️ PC EN PANTALLA COMPLETA */
body.fullscreen .monitor-wrapper{

}

  grid-auto-rows: 180px; /* altura de los paneles */
}
.monitor .panel{
  background:#111;

}

const bars = document.querySelectorAll("#waves span");

/* === CAMBIO DE ESTILO DE ONDAS === */

const waveBtn = document.getElementById("waveBtn");

const waveModes = [
  "lightning-line",   // 4️⃣ rayo
  "circle-pulse",     // 5️⃣ círculos

function animateWaves(){
  requestAnimationFrame(animateWaves);
  analyser.getByteFrequencyData(dataArray);
// 🔊 ENERGÍA PROMEDIO GENERAL
let totalEnergy = 0;
for(let i = 0; i < bufferLength; i++){
  totalEnergy += dataArray[i];
}
const avgEnergy = totalEnergy / bufferLength;

// 🎚️ intensidad máxima del movimiento lateral
const maxSpread = 22;
 bars.forEach((bar, i) => {
  // 🎯 centro del visualizador
const centerIndex = Math.floor(bars.length / 2);
// índice real del audio
const index = Math.floor(i * bufferLength / bars.length);

// energía propia
let value = dataArray[index];

// 🔥 energía central dominante
const centerEnergy =
  dataArray[Math.floor(centerIndex * bufferLength / bars.length)];

// 📏 distancia al centro (0 = centro)
const distanceFromCenter = Math.abs(i - centerIndex) / centerIndex;

// 🎚️ mezcla: centro fuerte → lados más suaves
value = value * (1 - distanceFromCenter) + centerEnergy * distanceFromCenter;

    // 🔥 VIDA MINIMA PARA TODAS LAS BARRAS
   const minEnergy = 30;
value = Math.max(value, minEnergy);

// 🎶 pulso global (respiración)
value += avgEnergy * 0.45;

// 🎶 empuje rítmico mínimo (para ondas muertas)
const pulse = avgEnergy * 0.35;
value += pulse;

    // 🔊 REALCE PROGRESIVO (las del final no mueren)
    const boost = 1 + (i / bars.length) * 0.50;

    // 🎚️ ALTURA FINAL DE LAS ONDAS SONORAS
   let height = value * (isDesktop ? 1.4 : 2.1) * boost;

    bar.style.height = height + 'px';


if(currentMode === 0){ // barras
  height = Math.max(30, value * 2);
}


if(currentMode === 0){ // lightning-line
  height = Math.max(35, value * 2.2);
}
else if(currentMode === 1){ // circle-pulse
  height = Math.max(25, value * 1.8);
}
else if(currentMode === 2){ // mode-bars
  height = Math.max(30, value * 2);
}

/* vibración eléctrica */
// 🔁 MOVIMIENTO SIMÉTRICO IZQ ↔ CENTRO ↔ DER
const center = bars.length / 2;

// dirección según posición
const direction = i < center ? -1 : 1;

// fuerza según distancia al centro
const distanceFactor = Math.abs(i - center) / center;

// movimiento lateral al ritmo del audio
// 🔁 MOVIMIENTO BASE (aunque no haya picos)
const baseMove = 4;

// 🔁 movimiento total forzado
const moveX =
  direction *
  distanceFactor *
  (
    baseMove +
    (avgEnergy / 255) * maxSpread
  );

// aplicar transformación
bar.style.transform = `
  translateX(${moveX}px)
  scaleY(${height / 250})
  
`;
const microShake = Math.sin(Date.now() / 140 + i) * 1.5;
    bar.style.height = height + "px";
  });
}

let monitorAnalyser;
let monitorDataFreq;
let monitorDataTime;
let monitorStarted = false;

const waveCanvas = document.getElementById("wave");

function resizeMonitor(){

  });

function initMonitor(){

if(monitorStarted) return;
if(!audioCtx || !source) return;
  monitorAnalyser = audioCtx.createAnalyser();
  monitorAnalyser.fftSize = 2048;

  source.connect(monitorAnalyser);

  monitorDataFreq = new Uint8Array(monitorAnalyser.frequencyBinCount);
  monitorDataTime = new Uint8Array(monitorAnalyser.fftSize);

  createSpectrumBars();
  drawMonitor();

  monitorStarted = true;
}

function createSpectrumBars(){
  const spectrum = document.getElementById("spectrum");
  if(spectrum.children.length) return;

  for(let i=0;i<32;i++){
    const bar=document.createElement("div");
    bar.className="bar";
    spectrum.appendChild(bar);
  }
}

function drawMonitor(){
  requestAnimationFrame(drawMonitor);
  if(!monitorAnalyser) return;

  monitorAnalyser.getByteFrequencyData(monitorDataFreq);
  monitorAnalyser.getByteTimeDomainData(monitorDataTime);

  let sum=0;
  for(let i=0;i<monitorDataFreq.length;i++) sum+=monitorDataFreq[i];
  let avg=sum/monitorDataFreq.length;

document.getElementById("m1").style.height=(avg/2)+"%";
document.getElementById("m2").style.height=(avg/2.5)+"%";
document.getElementById("m3").style.height=(avg/1.8)+"%";
document.getElementById("m4").style.height=(avg/2.2)+"%";
document.getElementById("m5").style.height=(avg/1.6)+"%";
document.getElementById("m6").style.height=(avg/2.8)+"%";

  const bars=document.querySelectorAll(".bar");
  for(let i=0;i<bars.length;i++){
    bars[i].style.height=(monitorDataFreq[i]/3)+"px";
  }

  drawWave(waveCtx,waveCanvas,monitorDataTime);
  drawWave(scopeCtx,scopeCanvas,monitorDataTime);
  drawWave(mpxCtx,mpxCanvas,monitorDataTime);

  document.getElementById("mpxVal").textContent=(avg/10).toFixed(1);
}

function drawWave(ctx,canvas,data){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="#00ff00";
  ctx.lineWidth=1;
  ctx.beginPath();

  let slice = canvas.width / data.length;
  let x = 0;

  for(let i=0;i<data.length;i++){
    let v = data[i] / 255;
    let y = (1 - v) * canvas.height;

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);

    x += slice;
  }

  ctx.stroke();
}
